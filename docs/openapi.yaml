openapi: 3.1.0
info:
  version: 1.0.0
  title: Phonebook API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    İletişim bilgileri yönetimi için API dokümantasyonu.
    Kimlik doğrulama, oturum yönetimi, şifre sıfırlama ve fotoğraf yükleme özelliklerini içerir.

tags:
  - name: Contacts
    description: İletişim işlemleri
  - name: Auth
    description: Kimlik doğrulama ve oturum işlemleri

servers:
  - url: http://localhost:3000
    description: Local Server
  - url: https://contacts-app-qfea.onrender.com
    description: Render (production)

paths:
  /contacts:
    $ref: ../swagger/paths/contacts/root.yaml

  /contacts/{contactId}:
    $ref: ../swagger/paths/contacts/{contactId}/root.yaml

  # Auth endpointlerini daha sonra eklemek için yedekte kalsın
  # /auth/register:
  #   $ref: ../swagger/paths/auth/register/root.yaml
  # /auth/login:
  #   $ref: ../swagger/paths/auth/login/root.yaml
  # /auth/refresh:
  #   $ref: ../swagger/paths/auth/refresh/root.yaml
  # /auth/logout:
  #   $ref: ../swagger/paths/auth/logout/root.yaml
  # /auth/send-reset-email:
  #   $ref: ../swagger/paths/auth/send-reset-email/root.yaml
  # /auth/reset-pwd:
  #   $ref: ../swagger/paths/auth/reset-pwd/root.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT