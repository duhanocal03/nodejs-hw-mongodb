type: object
properties:
  _id:
    type: string
    example: 69a38c116336fe2a290e1753
  userId:
    type: string
    example: 69a389fd6336fe2a290e1741
  name:
    type: string
    example: Test Contact
  phoneNumber:
    type: string
    example: "555123456"
  email:
    type: string
    nullable: true
    example: test@mail.com
  isFavourite:
    type: boolean
    example: true
  contactType:
    type: string
    enum: [work, home, personal]
    example: personal
  photo:
    type: string
    nullable: true
    example: https://res.cloudinary.com/demo/image/upload/v123/contacts-photos/sample.jpg
  createdAt:
    type: string
    format: date-time
    example: 2026-03-03T10:00:00.000Z
  updatedAt:
    type: string
    format: date-time
    example: 2026-03-03T10:00:00.000Z