get:
  tags:
    - Contacts
  summary: Get contacts list
  operationId: getAllContacts
  description: >
    Returns a paginated list of contacts for the authenticated user.
    Supports sorting and filtering.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
      description: Page number
    - in: query
      name: perPage
      schema:
        type: integer
        default: 10
      description: Number of items per page
    - in: query
      name: sortBy
      schema:
        type: string
        example: name
      description: Field to sort by
    - in: query
      name: sortOrder
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort order
    - in: query
      name: type
      schema:
        type: string
        enum: [work, home, personal]
      description: Filter by contactType
    - in: query
      name: isFavourite
      schema:
        type: boolean
      description: Filter by favourite status
  responses:
    '200':
      description: Successfully found contacts
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/contactsListResponse.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/error.yaml

post:
  tags:
    - Contacts
  summary: Create contact
  operationId: createContact
  description: >
    Creates a new contact for the authenticated user.
    Supports multipart/form-data and optional photo upload.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - name
            - phoneNumber
            - contactType
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
              example: Test Contact
            phoneNumber:
              type: string
              minLength: 3
              maxLength: 20
              example: "555123456"
            email:
              type: string
              format: email
              example: test@mail.com
            isFavourite:
              type: boolean
              example: true
            contactType:
              type: string
              enum: [work, home, personal]
              example: personal
            photo:
              type: string
              format: binary
  responses:
    '201':
      description: Contact created
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully created contact!
              data:
                $ref: ../../components/schemas/contact.yaml
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/error.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/error.yaml