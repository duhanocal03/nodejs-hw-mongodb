tags:
  - Contacts
summary: Get contacts list
operationId: getAllContacts
description: Returns paginated list of contacts for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
    description: Page number
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
    description: Number of items per page
  - in: query
    name: sortBy
    schema:
      type: string
      example: name
    description: Field to sort by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort order
  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter by contactType
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter by favourite flag
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/contactsListResponse.yaml
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/error.yaml