tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: Deletes a contact for the authenticated user.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: MongoDB contact id
responses:
  '204':
    description: Contact deleted successfully (No Content)
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/error.yaml